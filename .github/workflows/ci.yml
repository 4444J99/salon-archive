name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # tests/test_data_export.py reads seed data from the sibling ../koinonia-db/seed
      - name: Check out koinonia-db (pinned SHA, polyrepo sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 4444J99/koinonia-db
          ref: b5c52aeb4f437bc863d03fb9643c2d719dca5ea6
          path: .deps/koinonia-db
          persist-credentials: false
      - name: Link koinonia-db as sibling
        run: ln -s "$GITHUB_WORKSPACE/.deps/koinonia-db" "$GITHUB_WORKSPACE/../koinonia-db"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install "koinonia-db @ git+https://github.com/organvm-vi-koinonia/koinonia-db.git"
      - run: pip install -e ".[dev]"
      - name: Type check with pyright
        run: |
          pip install pyright
          pyright src/
      - run: python -m pytest tests/ -v
      - run: python -m ruff check src/
